<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }
        .header img { width: 50px; border-radius: 10px; }
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }
        .message {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 70%;
            line-height: 1.4;
        }
        .bot-msg {
            background-color: #1f2937;
            align-self: flex-start;
        }
        .user-msg {
            background-color: #3b82f6;
            align-self: flex-end;
        }
        .orb {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #3b82f6, #1e3a8a);
            border-radius: 50%;
            box-shadow: 0 0 40px #3b82f6;
            margin: 20px auto;
            transition: all 0.3s ease;
        }
        .orb.listening {
            box-shadow: 0 0 80px #10b981;
            background: radial-gradient(circle, #10b981, #065f46);
        }
        .input-area {
            display: flex;
            width: 100%;
            max-width: 800px;
            background-color: #1f2937;
            border-radius: 25px;
            padding: 5px 10px;
            align-items: center;
        }
        .mic-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
        }
        .mic-btn:disabled { color: #6b7280; cursor: not-allowed; }
        input[type="text"] {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
            font-size: 16px;
        }
        .send-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Yahan aap apna JARVIS logo URL daal sakte hain -->
        <h2>J.A.R.V.I.S.</h2>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message bot-msg">Hello. I'm JARVIS. How can I help you?</div>
    </div>

    <div class="orb" id="orb"></div>

    <div class="input-area">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">▶</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const orb = document.getElementById("orb");
        const micBtn = document.getElementById("mic-btn");

        let isSpeaking = false; // Track karne ke liye ki bot bol raha hai ya nahi
        let recognition;

        // Speech Recognition Setup (Mic)
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false; // Ek bar bolne ke baad khud band ho jayega
            recognition.interimResults = false;
            recognition.lang = 'en-IN'; // English India

            recognition.onstart = function() {
                orb.classList.add("listening");
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage(); // Bolne ke baad automatically send kar dega
            };

            recognition.onerror = function(event) {
                console.log("Mic error: ", event.error);
                orb.classList.remove("listening");
                userInput.placeholder = "Type your message...";
            };

            recognition.onend = function() {
                orb.classList.remove("listening");
                userInput.placeholder = "Type your message...";
            };
        } else {
            alert("Speech recognition is not supported in this browser. Please use Chrome.");
        }

        function toggleMic() {
            // Agar bot bol raha hai, toh mic on mat hone do
            if (isSpeaking) {
                console.log("Bot is speaking. Mic cannot be turned on right now.");
                return; 
            }
            recognition.start();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(sender === "user" ? "user-msg" : "bot-msg");
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Stop mic immediately if it's still running when user hits send
            if(recognition) recognition.stop(); 

            addMessage(text, "user");
            userInput.value = "";

            try {
                // Backend API call (Flask default port 5000 hota hai)
                const response = await fetch("http://127.0.0.1:5000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error("Server or connection problem");
                }

                const data = await response.json();
                addMessage(data.response, "bot");
                speakText(data.response);

            } catch (error) {
                console.error("Fetch Error:", error);
                addMessage("Sorry, there is a server or connection problem.", "bot");
                speakText("Sorry, there is a server or connection problem.");
            }
        }

        // Text to Speech Function
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Pehle se kuch bol raha ho toh stop karo

                // IMPORTANT: Bot bolna shuru karne se pehle mic forcefully off karo
                if(recognition) {
                    recognition.abort(); 
                }
                
                isSpeaking = true;
                micBtn.disabled = true; // Mic button ko click hone se roko

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-IN';
                
                // Jab bot bolna band karega, tab wapas sab normal hoga
                utterance.onend = function() {
                    isSpeaking = false;
                    micBtn.disabled = false; // Ab user dobara click karke bol sakta hai
                    console.log("Bot finished speaking.");
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
