<script>
/* ============================================================
   EMERGENCY MICROPHONE KILL SWITCH
   This forcibly kills ANY recognition session whenever
   JARVIS starts speaking.
============================================================ */

let HARD_MIC_LOCK = false;

function HARD_STOP_MIC() {

    HARD_MIC_LOCK = true;

    try {
        if (window.recognition) {
            window.recognition.abort();
            window.recognition.stop();
        }
    } catch (e) {}

    try {
        if (window.activeRecognition) {
            window.activeRecognition.abort();
            window.activeRecognition.stop();
        }
    } catch (e) {}

    try {
        if (window.speechRecognition) {
            window.speechRecognition.abort();
            window.speechRecognition.stop();
        }
    } catch (e) {}

    try {
        if (
            window.webkitSpeechRecognition &&
            window.__jarvisRecognition
        ) {
            window.__jarvisRecognition.abort();
            window.__jarvisRecognition.stop();
        }
    } catch (e) {}

    try {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
    } catch (e) {}

    const micStatus =
        document.getElementById("micStatus");

    const micButton =
        document.getElementById("micButton");

    const orb =
        document.getElementById("orb");

    if (micStatus) {
        micStatus.textContent = "MIC OFF";
    }

    if (micButton) {
        micButton.textContent = "🎤";
    }

    if (orb) {
        orb.classList.remove("listening");
    }
}


/*
    As soon as audio starts:
    KILL MICROPHONE.
*/

document.addEventListener(
    "play",
    function(event) {

        if (
            event.target instanceof HTMLAudioElement
        ) {

            HARD_STOP_MIC();
        }
    },
    true
);


/*
    Keep microphone locked while JARVIS audio exists.
*/

setInterval(
    function() {

        const audioElements =
            document.querySelectorAll("audio");

        let jarvisAudioPlaying = false;

        audioElements.forEach(
            function(audio) {

                if (
                    !audio.paused &&
                    !audio.ended
                ) {

                    jarvisAudioPlaying = true;
                }
            }
        );

        if (
            jarvisAudioPlaying
        ) {

            HARD_STOP_MIC();
        }

    },
    100
);


/*
    Browser fallback speech.
*/

if (
    window.speechSynthesis
) {

    const originalSpeak =
        window.speechSynthesis.speak.bind(
            window.speechSynthesis
        );

    window.speechSynthesis.speak =
        function(utterance) {

            HARD_STOP_MIC();

            return originalSpeak(
                utterance
            );
        };
}


/*
    Stop microphone before EVERY AI request.
*/

const originalFetch =
    window.fetch;

window.fetch =
    async function() {

        try {

            const args =
                arguments;

            const url =
                String(args[0]);

            if (
                url.includes("/ask-ai")
                ||
                url.includes("/speak")
            ) {

                HARD_STOP_MIC();
            }

        } catch (e) {}

        return originalFetch.apply(
            this,
            arguments
        );
    };


/*
    Extra protection:
    keyboard shortcuts cannot accidentally
    restart the microphone.
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            HARD_STOP_MIC();
        }
    }
);

</script>
