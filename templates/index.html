<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b12"
    >


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='logo.png') }}?v=50"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="{{ url_for('static', filename='logo.png') }}?v=50"
    >


    <title>JARVIS AI Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #18243b 0%,
                    #070b12 48%,
                    #030509 100%
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .app {

            width:
                min(1000px, 95vw);

            min-height:
                95vh;

            display: flex;

            flex-direction: column;

            padding: 18px;
        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            padding-bottom: 15px;
        }


        .brand-area {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .top-logo {

            width: 58px;

            height: 58px;

            object-fit: cover;

            object-position: center;

            border-radius: 12px;

            background: white;

            display: block;

            flex-shrink: 0;
        }


        .brand {

            font-size: 28px;

            font-weight: 800;

            letter-spacing: 3px;
        }


        .status {

            text-align: right;

            font-size: 13px;

            opacity: .78;
        }


        #istClock {

            margin-top: 5px;

            font-size: 15px;

            font-weight: 700;
        }


        #micStatus {

            margin-top: 4px;

            font-size: 11px;

            font-weight: 700;

            opacity: .7;
        }


        /* =====================================================
           LANGUAGE
        ====================================================== */

        #languageScreen {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .language-card {

            width:
                min(470px, 94vw);

            padding: 35px;

            border-radius: 26px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.10);

            backdrop-filter:
                blur(20px);

            text-align: center;
        }


        .language-card h1 {

            margin:
                0 0 10px;

            font-size: 34px;
        }


        .language-card p {

            margin:
                0 0 25px;

            opacity: .70;
        }


        .lang-button {

            width: 100%;

            margin-top: 12px;

            padding: 17px 20px;

            border: 0;

            border-radius: 16px;

            background:
                rgba(255,255,255,.10);

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;
        }


        .lang-button:hover {

            background:
                rgba(255,255,255,.19);
        }


        /* =====================================================
           CHAT
        ====================================================== */

        #chatScreen {

            display: none;

            flex: 1;

            flex-direction: column;

            min-height: 0;
        }


        .chat-box {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                5px 2px 20px;
        }


        .message-row {

            display: flex;

            margin: 12px 0;
        }


        .message-row.user {

            justify-content: flex-end;
        }


        .message-row.jarvis {

            justify-content: flex-start;
        }


        .message {

            max-width:
                min(760px, 88%);

            padding:
                14px 17px;

            border-radius: 18px;

            line-height: 1.55;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        .message.user {

            background:
                #2667ff;
        }


        .message.jarvis {

            background:
                rgba(255,255,255,.08);

            border:
                1px solid
                rgba(255,255,255,.08);
        }


        .thinking {

            opacity: .60;

            font-style: italic;
        }


        /* =====================================================
           YOUTUBE
        ====================================================== */

        .youtube-area {

            display: none;

            width:
                min(760px, 100%);

            margin:
                5px auto 15px;

            border-radius: 18px;

            overflow: hidden;

            background: black;
        }


        .youtube-area iframe {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            border: 0;
        }


        /* =====================================================
           ORB
        ====================================================== */

        .orb-area {

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                12px 0 17px;
        }


        .orb {

            width: 100px;

            height: 100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #ffffff,
                    #70a7ff 18%,
                    #2465ff 50%,
                    #10204a 72%,
                    #050912 100%
                );

            box-shadow:
                0 0 25px
                rgba(80,140,255,.80),

                0 0 75px
                rgba(50,100,255,.40);

            cursor: pointer;

            transition:
                transform .15s,
                box-shadow .15s;
        }


        .orb.listening {

            animation:
                pulse .65s infinite alternate;
        }


        .orb.speaking {

            box-shadow:
                0 0 30px
                rgba(90,160,255,.95),

                0 0 100px
                rgba(50,100,255,.65);
        }


        @keyframes pulse {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.12);
            }
        }


        /* =====================================================
           INPUT
        ====================================================== */

        .input-area {

            display: flex;

            gap: 10px;

            align-items: center;
        }


        #userInput {

            flex: 1;

            min-width: 0;

            padding:
                16px 18px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 16px;

            outline: none;
        }


        #userInput::placeholder {

            color:
                rgba(255,255,255,.45);
        }


        .mic-button,
        .send-button {

            width: 54px;

            height: 54px;

            flex-shrink: 0;

            border: 0;

            border-radius: 16px;

            background:
                rgba(255,255,255,.10);

            color: white;

            cursor: pointer;

            font-size: 20px;
        }


        .mic-button:hover,
        .send-button:hover {

            background:
                rgba(255,255,255,.18);
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {

            text-align: center;

            margin-top: 10px;

            padding:
                8px 0 3px;

            font-size: 12px;

            color:
                rgba(255,255,255,.58);
        }


        .developer-name {

            color:
                rgba(255,255,255,.90);

            font-weight: 700;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 650px) {

            .app {

                width: 100vw;

                min-height: 100vh;

                padding: 12px;
            }


            .brand {

                font-size: 21px;

                letter-spacing: 2px;
            }


            .top-logo {

                width: 48px;

                height: 48px;
            }


            .status {

                font-size: 11px;
            }


            #istClock {

                font-size: 13px;
            }


            .language-card {

                padding:
                    28px 20px;
            }


            .message {

                max-width: 94%;
            }


            .orb {

                width: 86px;

                height: 86px;
            }
        }

    </style>

</head>

<div class="app">

         TOP BAR

    <div class="topbar">

                    encrypted-media;

<script>


// ============================================================
// GLOBAL STATE
// ============================================================

let selectedLanguage = null;

let recognition = null;

let recognitionSupported = false;

let micActive = false;

let micRequested = false;

let waitingForVoiceResult = false;

let pendingVoiceText = "";

let ttsSpeaking = false;

let currentAudio = null;

let currentAudioUrl = null;

let ttsAbortController = null;

let ttsGeneration = 0;

let aiController = null;


// ============================================================
// ELEMENTS
// ============================================================

const languageScreen =
    document.getElementById(
        "languageScreen"
    );


const chatScreen =
    document.getElementById(
        "chatScreen"
    );


const chatBox =
    document.getElementById(
        "chatBox"
    );


const userInput =
    document.getElementById(
        "userInput"
    );


const orb =
    document.getElementById(
        "orb"
    );


const micButton =
    document.getElementById(
        "micButton"
    );


const languageStatus =
    document.getElementById(
        "languageStatus"
    );


const istClock =
    document.getElementById(
        "istClock"
    );


const micStatus =
    document.getElementById(
        "micStatus"
    );


const youtubeArea =
    document.getElementById(
        "youtubeArea"
    );


const youtubePlayer =
    document.getElementById(
        "youtubePlayer"
    );


// ============================================================
// MICROPHONE UI
// ============================================================

function setMicUI(
    active
) {

    if (active) {

        micStatus.textContent =
            "MIC ON";

        micButton.textContent =
            "⏹️";

        orb.classList.add(
            "listening"
        );

    } else {

        micStatus.textContent =
            "MIC OFF";

        micButton.textContent =
            "🎤";

        orb.classList.remove(
            "listening"
        );
    }
}


// ============================================================
// IST CLOCK
// ============================================================

const IST_OFFSET =
    19800000;


function getISTParts() {

    const date =
        new Date(
            Date.now()
            +
            IST_OFFSET
        );


    return {

        year:
            date.getUTCFullYear(),

        month:
            date.getUTCMonth() + 1,

        date:
            date.getUTCDate(),

        hour:
            date.getUTCHours(),

        minute:
            date.getUTCMinutes(),

        second:
            date.getUTCSeconds(),

        day:
            date.getUTCDay()
    };
}


function pad(value) {

    return String(value)
        .padStart(
            2,
            "0"
        );
}


function hour12(value) {

    const h =
        value % 12;

    return h === 0
        ? 12
        : h;
}


function ampm(value) {

    return value < 12
        ? "AM"
        : "PM";
}


function updateClock() {

    const t =
        getISTParts();


    istClock.textContent =
        `IST ${pad(hour12(t.hour))}:${pad(t.minute)}:${pad(t.second)} ${ampm(t.hour)}`;
}


updateClock();


setInterval(
    updateClock,
    1000
);


// ============================================================
// LANGUAGE
// ============================================================

function selectLanguage(
    language
) {

    selectedLanguage =
        language;


    languageScreen.style.display =
        "none";


    chatScreen.style.display =
        "flex";


    languageStatus.textContent =
        language === "hinglish"
            ? "Hinglish selected"
            : "English selected";


    if (
        language === "hinglish"
    ) {

        addMessage(
            "jarvis",
            "Haan bilkul. Main naturally Hinglish mein baat karunga. Batao kya poochna hai."
        );

    } else {

        addMessage(
            "jarvis",
            "Hello. I'm JARVIS. How can I help you?"
        );
    }


    initializeRecognition();


    setMicUI(
        false
    );


    userInput.focus();
}


// ============================================================
// MESSAGES
// ============================================================

function addMessage(
    type,
    text
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        `message-row ${type}`;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        `message ${type}`;


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    chatBox.appendChild(
        row
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function addThinking() {

    addMessage(
        "jarvis",

        selectedLanguage === "hinglish"
            ? "Soch raha hoon..."
            : "Thinking..."
    );


    const messages =
        document.querySelectorAll(
            ".message.jarvis"
        );


    if (
        messages.length
    ) {

        messages[
            messages.length - 1
        ].classList.add(
            "thinking"
        );
    }
}


function removeThinking() {

    const messages =
        document.querySelectorAll(
            ".message.jarvis"
        );


    if (
        !messages.length
    ) {

        return;
    }


    const last =
        messages[
            messages.length - 1
        ];


    if (
        last.textContent ===
            "Thinking..."
        ||
        last.textContent ===
            "Soch raha hoon..."
    ) {

        last.parentElement.remove();
    }
}


// ============================================================
// TIME / DATE
// ============================================================

function isTimeQuestion(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const phrases = [

        "what time is it",
        "what's the time",
        "whats the time",
        "current time",
        "current ist time",
        "ist time",
        "india time",
        "indian time",
        "kolkata time",
        "time in kolkata",
        "time in india",
        "tell me the time",

        "abhi kya time hai",
        "abhi kitne baje hain",
        "abhi kitne baje hai",
        "abhi time kya hai",
        "abhi ka time kya hai",
        "time kya hai",
        "time batao",
        "time bata",
        "kitne baje hain",
        "kitne baje hai",
        "india mein kya time hai",
        "india me kya time hai",
        "kolkata mein kya time hai",
        "kolkata me kya time hai"
    ];


    return phrases.some(
        phrase =>
            t.includes(
                phrase
            )
    );
}


function isDateQuestion(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const phrases = [

        "what date is it",
        "what is today's date",
        "what's today's date",
        "today's date",
        "todays date",
        "current date",
        "today date",
        "date today",
        "what day is today",
        "which day is today",

        "aaj ki date kya hai",
        "aaj ki tarikh kya hai",
        "aaj kya date hai",
        "aaj ka din kya hai",
        "aaj ka day kya hai",
        "aaj konsa din hai",
        "aaj kaun sa din hai",
        "aaj ka date kya hai"
    ];


    return phrases.some(
        phrase =>
            t.includes(
                phrase
            )
    );
}


function getTimeAnswer() {

    const t =
        getISTParts();


    const exact =
        `${hour12(t.hour)}:${pad(t.minute)}:${pad(t.second)} ${ampm(t.hour)}`;


    if (
        selectedLanguage === "hinglish"
    ) {

        let part;


        if (
            t.hour >= 4
            &&
            t.hour < 12
        ) {

            part = "subah";

        } else if (
            t.hour >= 12
            &&
            t.hour < 17
        ) {

            part = "dopahar";

        } else if (
            t.hour >= 17
            &&
            t.hour < 21
        ) {

            part = "shaam";

        } else {

            part = "raat";
        }


        return (
            `Abhi Kolkata aur poore India mein IST ke hisaab se ${exact} ho rahe hain, yani ${part} ka time hai.`
        );
    }


    return (
        `The current time in Kolkata, India is ${exact} IST.`
    );
}


function getDateAnswer() {

    const t =
        getISTParts();


    const days = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];


    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];


    if (
        selectedLanguage === "hinglish"
    ) {

        return (
            `Aaj ${days[t.day]} hai aur IST ke hisaab se date ${t.date} ${months[t.month - 1]} ${t.year} hai.`
        );
    }


    return (
        `Today is ${days[t.day]}, ${t.date} ${months[t.month - 1]} ${t.year} in India.`
    );
}


// ============================================================
// CLEAN TTS TEXT
// ============================================================

function cleanForSpeech(
    text
) {

    let result =
        String(
            text || ""
        );


    result =
        result.replace(
            /```[\s\S]*?```/g,
            " "
        );


    result =
        result.replace(
            /\[([^\]]+)\]\([^)]+\)/g,
            "$1"
        );


    result =
        result.replace(
            /[*_#>`~|]/g,
            " "
        );


    result =
        result.replace(
            /["“”‘’]/g,
            " "
        );


    result =
        result.replace(
            /[\[\]\{\}]/g,
            " "
        );


    try {

        result =
            result.replace(
                /\p{Extended_Pictographic}/gu,
                " "
            );

    } catch (e) {
    }


    return result
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


// ============================================================
// STOP MICROPHONE
//
// IMPORTANT:
// This NEVER restarts it.
// ============================================================

function stopMicrophone(
    clearPending = true
) {

    micRequested =
        false;


    waitingForVoiceResult =
        false;


    if (
        recognition
        &&
        micActive
    ) {

        try {

            recognition.abort();

        } catch (e) {

            try {

                recognition.stop();

            } catch (ignored) {
            }
        }
    }


    micActive =
        false;


    if (
        clearPending
    ) {

        pendingVoiceText =
            "";
    }


    setMicUI(
        false
    );
}


// ============================================================
// STOP TTS
// ============================================================

function stopTTS() {

    ttsGeneration++;


    ttsSpeaking =
        false;


    if (
        ttsAbortController
    ) {

        try {

            ttsAbortController.abort();

        } catch (e) {
        }


        ttsAbortController =
            null;
    }


    if (
        currentAudio
    ) {

        try {

            currentAudio.pause();

            currentAudio.currentTime =
                0;

            currentAudio.src =
                "";

        } catch (e) {
        }


        currentAudio =
            null;
    }


    if (
        currentAudioUrl
    ) {

        try {

            URL.revokeObjectURL(
                currentAudioUrl
            );

        } catch (e) {
        }


        currentAudioUrl =
            null;
    }


    if (
        "speechSynthesis"
        in window
    ) {

        try {

            speechSynthesis.cancel();

        } catch (e) {
        }
    }


    orb.classList.remove(
        "speaking"
    );
}


// ============================================================
// TTS
//
// NO MICROPHONE STARTS HERE.
// ============================================================

async function speakText(
    text
) {

    /*
        Absolutely stop mic BEFORE generating/playing
        the answer.
    */

    stopMicrophone();


    stopTTS();


    const cleanText =
        cleanForSpeech(
            text
        );


    if (
        !cleanText
    ) {

        return;
    }


    ttsSpeaking =
        true;


    orb.classList.add(
        "speaking"
    );


    const generation =
        ttsGeneration;


    try {

        ttsAbortController =
            new AbortController();


        const response =
            await fetch(
                "/speak",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({

                            text:
                                cleanText,

                            language:
                                selectedLanguage
                        }),

                    signal:
                        ttsAbortController
                            .signal
                }
            );


        if (
            generation !==
            ttsGeneration
        ) {

            return;
        }


        if (
            !response.ok
        ) {

            throw new Error(
                "TTS server failed."
            );
        }


        const blob =
            await response.blob();


        if (
            generation !==
            ttsGeneration
        ) {

            return;
        }


        currentAudioUrl =
            URL.createObjectURL(
                blob
            );


        currentAudio =
            new Audio(
                currentAudioUrl
            );


        currentAudio.preload =
            "auto";


        currentAudio.volume =
            1;


        currentAudio.onplay =
            function() {

                ttsSpeaking =
                    true;


                /*
                    IMPORTANT:
                    No microphone code here.
                */

                setMicUI(
                    false
                );
            };


        currentAudio.onended =
            function() {

                ttsSpeaking =
                    false;


                orb.classList.remove(
                    "speaking"
                );


                if (
                    currentAudioUrl
                ) {

                    try {

                        URL.revokeObjectURL(
                            currentAudioUrl
                        );

                    } catch (e) {
                    }


                    currentAudioUrl =
                        null;
                }


                currentAudio =
                    null;


                /*
                    MIC REMAINS OFF.
                */

                setMicUI(
                    false
                );
            };


        currentAudio.onerror =
            function() {

                ttsSpeaking =
                    false;


                orb.classList.remove(
                    "speaking"
                );


                setMicUI(
                    false
                );


                currentAudio =
                    null;
            };


        await currentAudio.play();


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            return;
        }


        console.error(
            "TTS ERROR:",
            error
        );


        ttsSpeaking =
            false;


        orb.classList.remove(
            "speaking"
        );


        /*
            Browser fallback.
            Still no microphone.
        */

        if (
            "speechSynthesis"
            in window
        ) {

            try {

                const speech =
                    new SpeechSynthesisUtterance(
                        cleanText
                    );


                speech.lang =
                    "en-IN";


                speech.rate =
                    selectedLanguage ===
                    "hinglish"
                        ? 0.9
                        : 0.95;


                speech.onstart =
                    function() {

                        ttsSpeaking =
                            true;


                        orb.classList.add(
                            "speaking"
                        );


                        setMicUI(
                            false
                        );
                    };


                speech.onend =
                    function() {

                        ttsSpeaking =
                            false;


                        orb.classList.remove(
                            "speaking"
                        );


                        setMicUI(
                            false
                        );
                    };


                speech.onerror =
                    function() {

                        ttsSpeaking =
                            false;


                        orb.classList.remove(
                            "speaking"
                        );


                        setMicUI(
                            false
                        );
                    };


                speechSynthesis.cancel();


                speechSynthesis.speak(
                    speech
                );

            } catch (fallbackError) {

                console.error(
                    "BROWSER TTS ERROR:",
                    fallbackError
                );
            }
        }
    }
}


// ============================================================
// RECOGNITION SETUP
//
// Recognition is CREATED here only.
// It NEVER auto-starts.
// ============================================================

function initializeRecognition() {

    if (
        recognition
    ) {

        return;
    }


    const SpeechRecognition =
        window.SpeechRecognition
        ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        recognitionSupported =
            false;

        return;
    }


    recognitionSupported =
        true;


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    /*
        One user question only.
        It automatically ends after the utterance.
    */

    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        function() {

            /*
                NEVER allow recognition while JARVIS is speaking.
            */

            if (
                ttsSpeaking
                ||
                !micRequested
            ) {

                try {

                    recognition.abort();

                } catch (e) {
                }


                return;
            }


            micActive =
                true;


            setMicUI(
                true
            );
        };


    recognition.onresult =
        function(event) {

            /*
                Hard protection:
                JARVIS's own speech is never accepted.
            */

            if (
                ttsSpeaking
                ||
                !micRequested
            ) {

                return;
            }


            let finalText =
                "";


            let interimText =
                "";


            for (
                let i =
                    event.resultIndex;

                i <
                event.results.length;

                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript
                        .trim();


                if (
                    event.results[i]
                        .isFinal
                ) {

                    finalText +=
                        (
                            finalText
                                ? " "
                                : ""
                        )
                        +
                        transcript;

                } else {

                    interimText +=
                        (
                            interimText
                                ? " "
                                : ""
                        )
                        +
                        transcript;
                }
            }


            if (
                interimText
            ) {

                userInput.value =
                    interimText;
            }


            if (
                finalText
            ) {

                /*
                    QUESTION IS COMPLETE.

                    Turn microphone state OFF immediately.
                    Then wait for recognition.onend.
                */

                pendingVoiceText =
                    finalText;


                waitingForVoiceResult =
                    true;


                micRequested =
                    false;


                setMicUI(
                    false
                );


                try {

                    recognition.stop();

                } catch (e) {
                }
            }
        };


    recognition.onend =
        function() {

            micActive =
                false;


            setMicUI(
                false
            );


            /*
                NO automatic restart.
            */

            if (
                waitingForVoiceResult
                &&
                pendingVoiceText
            ) {

                const question =
                    pendingVoiceText;


                pendingVoiceText =
                    "";


                waitingForVoiceResult =
                    false;


                /*
                    Recognition has ended.
                    NOW and only now send the question.
                */

                setTimeout(
                    function() {

                        sendMessage(
                            question
                        );

                    },
                    80
                );
            }
        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            micActive =
                false;


            micRequested =
                false;


            waitingForVoiceResult =
                false;


            pendingVoiceText =
                "";


            setMicUI(
                false
            );


            /*
                NO automatic restart.
            */
        };
}


// ============================================================
// MICROPHONE TOGGLE
//
// ONLY A USER CLICK CAN CALL THIS.
// ============================================================

function toggleMicrophone() {

    /*
        If JARVIS is speaking:
        user click = stop speech first,
        then start mic.
    */

    if (
        ttsSpeaking
    ) {

        stopTTS();


        setTimeout(
            startMicrophone,
            100
        );


        return;
    }


    /*
        If mic is already ON:
        this click turns it OFF.
    */

    if (
        micActive
        ||
        micRequested
    ) {

        stopMicrophone();

        return;
    }


    startMicrophone();
}


// ============================================================
// START MICROPHONE
// ============================================================

function startMicrophone() {

    /*
        Never start while JARVIS is talking.
    */

    if (
        ttsSpeaking
    ) {

        return;
    }


    if (
        !recognition
    ) {

        initializeRecognition();
    }


    if (
        !recognitionSupported
        ||
        !recognition
    ) {

        addMessage(
            "jarvis",
            "Voice input is not supported in this browser. Chrome ya Edge use karo."
        );


        return;
    }


    pendingVoiceText =
        "";


    waitingForVoiceResult =
        false;


    micRequested =
        true;


    setMicUI(
        true
    );


    try {

        recognition.lang =
            "en-IN";


        recognition.continuous =
            false;


        recognition.interimResults =
            true;


        recognition.start();

    } catch (error) {

        console.log(
            "MIC START ERROR:",
            error
        );


        micRequested =
            false;


        setMicUI(
            false
        );
    }
}


// ============================================================
// MUSIC
// ============================================================

function isMusicCommand(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const actions = [

        "play",
        "bajao",
        "baja do",
        "chalao",
        "chala do",
        "sunao",
        "suna do"
    ];


    const musicWords = [

        "song",
        "music",
        "gaana",
        "gana",
        "gaane",
        "track"
    ];


    const hasAction =
        actions.some(
            word =>
                t.includes(
                    word
                )
        );


    const hasMusic =
        musicWords.some(
            word =>
                t.includes(
                    word
                )
        );


    return (
        hasAction
        &&
        (
            hasMusic
            ||
            t.includes(
                "youtube"
            )
            ||
            t.startsWith(
                "play "
            )
        )
    );
}


function extractMusicQuery(
    text
) {

    let query =
        text.toLowerCase();


    const patterns = [

        /\bplay\b/gi,
        /\bplease\b/gi,
        /\bopen\b/gi,
        /\bwatch\b/gi,
        /\blisten\s+to\b/gi,
        /\blisten\b/gi,

        /\bon\s+youtube\b/gi,
        /\byoutube\b/gi,
        /\byou\s+tube\b/gi,

        /\b(song|music|track)\b/gi,

        /\b(gaana|gana|gaane)\b/gi,

        /\b(bajao|baja do)\b/gi,

        /\b(chalao|chala do)\b/gi,

        /\b(sunao|suna do)\b/gi,

        /\b(par|pe)\b/gi
    ];


    for (
        const pattern of patterns
    ) {

        query =
            query.replace(
                pattern,
                " "
            );
    }


    return query
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        ||
        "music";
}


// ============================================================
// PLAY MUSIC
// ============================================================

async function playMusic(
    originalText
) {

    stopMicrophone();

    stopTTS();


    const query =
        extractMusicQuery(
            originalText
        );


    addThinking();


    try {

        const response =
            await fetch(
                "/youtube",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({
                            query:
                                query
                        })
                }
            );


        const data =
            await response.json();


        removeThinking();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                data.error
                ||
                "YouTube search failed."
            );
        }


        if (
            data.video_id
        ) {

            youtubeArea.style.display =
                "block";


            youtubePlayer.src =
                "https://www.youtube.com/embed/"
                +
                encodeURIComponent(
                    data.video_id
                )
                +
                "?autoplay=1&playsinline=1&rel=0";


            const message =
                selectedLanguage ===
                "hinglish"

                    ?

                `Theek hai, ${data.title} YouTube par play kar raha hoon.`

                    :

                `Okay, playing ${data.title} on YouTube.`;


            addMessage(
                "jarvis",
                message
            );


            speakText(
                message
            );


        } else {

            window.open(
                data.url,
                "_blank"
            );


            const message =
                selectedLanguage ===
                "hinglish"

                    ?

                `YouTube par ${query} search kar raha hoon.`

                    :

                `Searching YouTube for ${query}.`;


            addMessage(
                "jarvis",
                message
            );


            speakText(
                message
            );
        }


    } catch (error) {

        removeThinking();


        const message =
            selectedLanguage ===
            "hinglish"

                ?

            "YouTube par song play nahi ho paaya."

                :

            "I could not play that song on YouTube.";


        addMessage(
            "jarvis",
            message
        );
    }
}


// ============================================================
// SEND MESSAGE
//
// Voice message reaches here ONLY AFTER mic onend.
// ============================================================

async function sendMessage(
    messageOverride = null
) {

    /*
        Absolutely turn microphone OFF before
        processing and speaking.
    */

    stopMicrophone();


    const prompt =
        messageOverride !== null
            ? String(
                messageOverride
            ).trim()
            : userInput.value.trim();


    if (
        !prompt
    ) {

        return;
    }


    userInput.value =
        "";


    addMessage(
        "user",
        prompt
    );


    /*
        MUSIC
    */

    if (
        isMusicCommand(
            prompt
        )
    ) {

        await playMusic(
            prompt
        );

        return;
    }


    /*
        TIME
    */

    if (
        isTimeQuestion(
            prompt
        )
    ) {

        const answer =
            getTimeAnswer();


        addMessage(
            "jarvis",
            answer
        );


        /*
            Mic is already OFF here.
        */

        speakText(
            answer
        );


        return;
    }


    /*
        DATE
    */

    if (
        isDateQuestion(
            prompt
        )
    ) {

        const answer =
            getDateAnswer();


        addMessage(
            "jarvis",
            answer
        );


        /*
            Mic is already OFF here.
        */

        speakText(
            answer
        );


        return;
    }


    /*
        Cancel previous AI request if necessary.
    */

    if (
        aiController
    ) {

        try {

            aiController.abort();

        } catch (e) {
        }
    }


    aiController =
        new AbortController();


    addThinking();


    try {

        const response =
            await fetch(
                "/ask-ai",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({

                            prompt:
                                prompt,

                            language:
                                selectedLanguage
                        }),

                    signal:
                        aiController.signal
                }
            );


        const data =
            await response.json();


        removeThinking();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                data.error
                ||
                "Server error."
            );
        }


        addMessage(
            "jarvis",
            data.answer
        );


        /*
            CRITICAL:
            Mic is OFF before this function is called.
        */

        speakText(
            data.answer
        );


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            removeThinking();

            return;
        }


        console.error(
            "AI ERROR:",
            error
        );


        removeThinking();


        const message =
            selectedLanguage ===
            "hinglish"

                ?

            "Sorry yaar, abhi server ya connection mein problem aa rahi hai."

                :

            "Sorry, there is a server or connection problem.";


        addMessage(
            "jarvis",
            message
        );


        speakText(
            message
        );
    }
}


// ============================================================
// TYPED MESSAGE
// ============================================================

function sendTypedMessage() {

    /*
        Typed message also makes sure mic is off.
    */

    stopMicrophone();


    sendMessage();
}


// ============================================================
// ENTER KEY
// ============================================================

function handleKey(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendTypedMessage();
    }
}


// ============================================================
// INITIAL STATE
// ============================================================

setMicUI(
    false
);

</script>
