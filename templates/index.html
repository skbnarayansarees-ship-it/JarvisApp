<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #logo { width: 250px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5)); transition: all 0.3s ease; }
        #logo.listening { filter: drop-shadow(0 0 40px rgba(52, 211, 153, 0.8)); transform: scale(1.05); }
        #status { font-size: 1.2rem; color: #94a3b8; margin-bottom: 20px; min-height: 30px; }
        #chat-box { width: 90%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; text-align: left; max-height: 300px; overflow-y: auto; }
        .user-text { color: #38bdf8; font-weight: bold; margin-bottom: 10px; }
        .ai-text { color: #f8fafc; margin-bottom: 15px; line-height: 1.5; }
        #yt-player-container { display: none; width: 100%; max-width: 600px; margin-top: 20px; }
        iframe { width: 100%; height: 315px; border-radius: 10px; border: none; }
    </style>
</head>
<body>

    <img id="logo" src="/static/logo.png" alt="Jarvis AI Logo">
    
    <div id="status">Click anywhere to activate Jarvis...</div>

    <div id="chat-box">
        <div id="conversation"></div>
    </div>

    <div id="yt-player-container">
        <iframe id="yt-player" src="" allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const logo = document.getElementById('logo');
        const conversation = document.getElementById('conversation');
        const ytPlayer = document.getElementById('yt-player');
        const ytContainer = document.getElementById('yt-player-container');

        let lastTimestamp = 0;
        let isSpeaking = false; 
        let lastSpokenTime = 0;

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        // Single phrase mode stops audio buffering loop
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-IN';

        function startListening() {
            // Self-hearing prevention guard
            if (isSpeaking || (Date.now() - lastSpokenTime < 1500)) return;
            try { 
                recognition.start(); 
            } catch(e) {}
        }

        function speak(text) {
            isSpeaking = true;
            
            // Abort mic immediately to clear remaining audio buffer
            try { recognition.abort(); } catch(e) {}
            window.speechSynthesis.cancel();

            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            
            const voices = synth.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('hi-IN') || v.lang.includes('en-IN'));
            if(preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => {
                isSpeaking = true;
                try { recognition.abort(); } catch(e) {}
            };
            
            utterance.onend = () => {
                isSpeaking = false;
                lastSpokenTime = Date.now();
                setTimeout(startListening, 1500); // 1.5s gap after speaking stops
            };

            utterance.onerror = () => {
                isSpeaking = false;
                lastSpokenTime = Date.now();
                setTimeout(startListening, 1000);
            };

            synth.speak(utterance);
        }

        function appendMessage(sender, text) {
            conversation.innerHTML += `<div class="${sender === 'You' ? 'user-text' : 'ai-text'}">${sender}: ${text}</div>`;
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        function sendCommand(text) {
            appendMessage("You", text);
            statusEl.innerText = "Thinking...";
            logo.classList.remove('listening');

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage("Jarvis", data.response);
                speak(data.response);
                statusEl.innerText = "Say 'Jarvis' to wake me up...";
            })
            .catch(error => {
                statusEl.innerText = "Connection Error.";
            });
        }

        recognition.onstart = () => {
            if (!isSpeaking && Date.now() - lastSpokenTime >= 1500) {
                statusEl.innerText = "Jarvis Active! Say 'Jarvis'...";
            }
        };

        recognition.onresult = (event) => {
            // STRICT CHECK: Reject audio captured during or immediately after speech
            if (isSpeaking || (Date.now() - lastSpokenTime < 1500)) {
                return;
            }

            const transcript = event.results[0][0].transcript.toLowerCase().trim();
            console.log("Heard:", transcript);

            if (transcript.includes('jarvis')) {
                statusEl.innerText = "Listening to your command...";
                logo.classList.add('listening');
                
                const commandPart = transcript.substring(transcript.indexOf('jarvis') + 6).trim();
                if (commandPart.length > 2) {
                    sendCommand(commandPart);
                }
            }
        };

        recognition.onerror = (event) => { 
            console.error("Mic Error:", event.error); 
        };
        
        recognition.onend = () => {
            if (!isSpeaking && (Date.now() - lastSpokenTime >= 1500)) {
                setTimeout(startListening, 400);
            }
        };

        document.addEventListener('click', () => {
            startListening();
        }, { once: true });

        // Global Device Sync
        setInterval(() => {
            fetch('/sync')
                .then(r => r.json())
                .then(data => {
                    if (data.action === "play_youtube" && data.timestamp > lastTimestamp) {
                        lastTimestamp = data.timestamp;
                        ytContainer.style.display = "block";
                        ytPlayer.src = `https://www.youtube.com/embed/${data.payload}?autoplay=1`;
                    }
                });
        }, 2000);
    </script>
</body>
</html>
