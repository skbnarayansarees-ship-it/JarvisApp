<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 800px; margin-bottom: 20px; }
        .header h2 { margin: 0; }
        
        .voice-select {
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .chat-container { flex: 1; width: 100%; max-width: 800px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 70%; line-height: 1.4; }
        .bot-msg { background-color: #1f2937; align-self: flex-start; }
        .user-msg { background-color: #3b82f6; align-self: flex-end; }
        
        .orb { width: 120px; height: 120px; background: radial-gradient(circle, #3b82f6, #1e3a8a); border-radius: 50%; box-shadow: 0 0 40px #3b82f6; margin: 20px auto; transition: all 0.3s ease; }
        .orb.listening { box-shadow: 0 0 80px #10b981; background: radial-gradient(circle, #10b981, #065f46); }
        
        .input-area { display: flex; width: 100%; max-width: 800px; background-color: #1f2937; border-radius: 25px; padding: 5px 10px; align-items: center; }
        
        .mic-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 10px; transition: opacity 0.3s; }
        .mic-btn.disabled { opacity: 0.2; pointer-events: none !important; }
        
        input[type="text"] { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; font-size: 16px; }
        .send-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>J.A.R.V.I.S.</h2>
        <select id="voice-mode" class="voice-select">
            <option value="hinglish" selected>🗣️ Hinglish Voice (Accurate Words)</option>
            <option value="english">🇬🇧 English Voice (Fluent Accent)</option>
        </select>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message bot-msg">Hello. I'm JARVIS. How can I help you today?</div>
    </div>

    <div class="orb" id="orb"></div>

    <div class="input-area">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">▶</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const orb = document.getElementById("orb");
        const micBtn = document.getElementById("mic-btn");
        const voiceModeSelect = document.getElementById("voice-mode");

        let isSpeaking = false; 
        let isListening = false;
        let recognition = null;
        let availableVoices = [];

        // Load voices list for browser TTS
        function loadVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        loadVoices();
        if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onstart = function() {
                if (isSpeaking) {
                    recognition.abort();
                    stopMicUI();
                    return;
                }
                isListening = true;
                orb.classList.add("listening");
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                if (isSpeaking) {
                    userInput.value = "";
                    stopMicUI();
                    return;
                }

                const transcript = event.results[0][0].transcript;
                stopMicUI();

                if (transcript && transcript.trim() !== "") {
                    userInput.value = transcript;
                    sendMessage(); 
                }
            };

            recognition.onerror = function() { stopMicUI(); };
            recognition.onend = function() { stopMicUI(); };
        }

        function stopMicUI() {
            isListening = false;
            orb.classList.remove("listening");
            userInput.placeholder = "Type your message...";
            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }
        }

        function toggleMic() {
            if (isSpeaking) return; 

            if (isListening) {
                stopMicUI();
            } else {
                if (recognition) {
                    try {
                        recognition.start();
                    } catch(e) {
                        stopMicUI();
                        setTimeout(() => { if(!isSpeaking) recognition.start(); }, 100);
                    }
                }
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(sender === "user" ? "user-msg" : "bot-msg");
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            stopMicUI();

            addMessage(text, "user");
            userInput.value = "";

            try {
                const response = await fetch("https://jarvis-ai-n0fu.onrender.com/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                addMessage(data.response, "bot");
                speakText(data.response);

            } catch (error) {
                const errorMsg = "Sorry, connection problem.";
                addMessage(errorMsg, "bot");
                speakText(errorMsg);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                isSpeaking = true;
                micBtn.classList.add("disabled");
                stopMicUI();

                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                const mode = voiceModeSelect.value;

                if (availableVoices.length === 0) {
                    availableVoices = window.speechSynthesis.getVoices();
                }

                // Voice selection logic
                if (mode === "english") {
                    utterance.lang = "en-US";
                    const engVoice = availableVoices.find(v => v.lang.includes("en-US") || v.lang.includes("en-GB"));
                    if (engVoice) utterance.voice = engVoice;
                } else {
                    utterance.lang = "hi-IN";
                    const hinVoice = availableVoices.find(v => v.lang.includes("hi-IN")) || 
                                     availableVoices.find(v => v.lang.includes("en-IN"));
                    if (hinVoice) utterance.voice = hinVoice;
                }

                utterance.onstart = function() {
                    isSpeaking = true;
                    stopMicUI();
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    micBtn.classList.remove("disabled");
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    micBtn.classList.remove("disabled");
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
