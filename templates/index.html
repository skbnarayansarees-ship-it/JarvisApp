<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .header { display: flex; align-items: center; gap: 15px; width: 100%; max-width: 800px; margin-bottom: 20px; }
        .chat-container { flex: 1; width: 100%; max-width: 800px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 70%; line-height: 1.4; }
        .bot-msg { background-color: #1f2937; align-self: flex-start; }
        .user-msg { background-color: #3b82f6; align-self: flex-end; }
        
        .orb { width: 120px; height: 120px; background: radial-gradient(circle, #3b82f6, #1e3a8a); border-radius: 50%; box-shadow: 0 0 40px #3b82f6; margin: 20px auto; transition: all 0.3s ease; }
        .orb.listening { box-shadow: 0 0 80px #10b981; background: radial-gradient(circle, #10b981, #065f46); }
        
        .input-area { display: flex; width: 100%; max-width: 800px; background-color: #1f2937; border-radius: 25px; padding: 5px 10px; align-items: center; }
        
        /* Mic button styles */
        .mic-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 10px; transition: opacity 0.3s; }
        .mic-btn.disabled { opacity: 0.2; pointer-events: none; } /* pointer-events: none se click puri tarah block ho jata hai */
        
        input[type="text"] { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; font-size: 16px; }
        .send-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div class="header"><h2>J.A.R.V.I.S.</h2></div>

    <div class="chat-container" id="chat-box">
        <div class="message bot-msg">Hello. I'm JARVIS. How can I help you?</div>
    </div>

    <div class="orb" id="orb"></div>

    <div class="input-area">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">▶</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const orb = document.getElementById("orb");
        const micBtn = document.getElementById("mic-btn");

        let isSpeaking = false; 
        let recognition = null;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false; // Never auto-restart
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onstart = function() {
                if (isSpeaking) {
                    recognition.abort(); // Agar galti se on hua toh turant kill
                    return;
                }
                orb.classList.add("listening");
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                // Sunte hi turant stop karo
                recognition.abort();
                orb.classList.remove("listening");
                userInput.placeholder = "Type your message...";
                
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage(); 
            };

            recognition.onerror = function() { stopMicUI(); };
            recognition.onend = function() { stopMicUI(); };
        }

        function stopMicUI() {
            orb.classList.remove("listening");
            userInput.placeholder = "Type your message...";
        }

        function toggleMic() {
            if (isSpeaking) return; // Bolte waqt koi action nahi
            
            if (recognition) {
                try { recognition.start(); } 
                catch(e) { 
                    recognition.abort(); 
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(sender === "user" ? "user-msg" : "bot-msg");
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Message bhejne se pehle mic strongly band
            if (recognition) recognition.abort(); 
            stopMicUI();

            addMessage(text, "user");
            userInput.value = "";

            try {
                const response = await fetch("http://127.0.0.1:5000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                addMessage(data.response, "bot");
                speakText(data.response);

            } catch (error) {
                const errorMsg = "Sorry, connection problem.";
                addMessage(errorMsg, "bot");
                speakText(errorMsg);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                
                // --- MOST IMPORTANT PART TO STOP THE LOOP ---
                if (recognition) { recognition.abort(); } 
                stopMicUI();
                
                isSpeaking = true;
                micBtn.classList.add("disabled"); // UI se click block
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-IN';
                
                utterance.onstart = function() {
                    // Jab actual awaz nikle tab dobara mic kill karo
                    if (recognition) { recognition.abort(); }
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    micBtn.classList.remove("disabled"); // Bot chup, click allowed
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    micBtn.classList.remove("disabled");
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
